<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoSched AI — Login</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d0d0d;
            color: #e5e7eb;
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 2rem;
        }
        .logo {
            font-family: 'Syne', sans-serif;
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #f5f5f5, #a3e635, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 0.5rem;
        }
        .tagline {
            text-align: center;
            color: #4b5563;
            font-size: 0.85rem;
            margin-bottom: 2.5rem;
        }
        .card {
            background: #161616;
            border: 1px solid #222;
            border-radius: 16px;
            padding: 2rem;
        }
        .card h2 {
            font-family: 'Syne', sans-serif;
            font-size: 1.1rem;
            color: #e5e7eb;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            font-size: 0.75rem;
            color: #4b5563;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 0.4rem;
        }
        input {
            width: 100%;
            background: #111;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 0.7rem 1rem;
            color: #e5e7eb;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
        }
        input:focus {
            outline: none;
            border-color: #a3e635;
        }
        .btn {
            width: 100%;
            background: linear-gradient(135deg, #a3e635, #22d3ee);
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 0.8rem;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1.2rem;
        }
        .btn:hover { opacity: 0.85; }
        .error {
            background: #450a0a;
            color: #fca5a5;
            padding: 0.7rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            text-align: center;
        }
        .success {
            background: #14532d;
            color: #86efac;
            padding: 0.7rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            text-align: center;
        }
        .default-creds {
            margin-top: 1.5rem;
            background: #111;
            border: 1px solid #1f1f1f;
            border-radius: 10px;
            padding: 1rem;
        }
        .default-creds h3 {
            font-family: 'Syne', sans-serif;
            font-size: 0.72rem;
            color: #4b5563;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 0.7rem;
        }
        .cred-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.4rem 0;
            border-bottom: 1px solid #1a1a1a;
            font-size: 0.82rem;
        }
        .cred-item:last-child { border-bottom: none; }
        .role-badge {
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .role-admin    { background: #1c3451; color: #93c5fd; }
        .role-principal { background: #1c1400; color: #fde68a; }
        .role-faculty  { background: #14532d; color: #86efac; }
        .footer {
            text-align: center;
            color: #374151;
            font-size: 0.75rem;
            margin-top: 2rem;
        }
        .footer strong { color: #a3e635; }
    </style>
</head>
<body>

<div class="login-container">
    <div class="logo">AutoSched AI</div>
    <div class="tagline">Academic Timetable Management System</div>

    <div class="card">
        <h2>🔐 Sign In</h2>

        <!-- Error message -->
        <div th:if="${param.error}" class="error">
            Invalid username or password. Please try again.
        </div>

        <!-- Logout message -->
        <div th:if="${param.logout}" class="success">
            You have been logged out successfully.
        </div>

        <form method="post" action="/login">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter username" required autofocus>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn">Sign In →</button>
        </form>
    </div>

    

    <div class="footer">
        Built by <strong>Gudi Indhu Reddy</strong>
    </div>
</div>

</body>
</html>
